<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workbench frame</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the theme before first paint so a dark frame never flashes light.
      (function () {
        var q = new URLSearchParams((location.hash.split('?')[1] || ''));
        if (q.get('theme') === 'dark') document.documentElement.classList.add('dark');
        if (q.get('rtl') === '1') document.documentElement.dir = 'rtl';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/frame/main.tsx"></script>
  </body>
</html>
