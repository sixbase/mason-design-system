<!--
  The page a component sits on: body font and colours from tokens, as on a
  real storefront page and in the workbench frame. Without it, anything a
  story doesn't wrap in a component (a label, a wrapper's text) fell back to
  the browser's Times and stayed black in dark mode.
-->
<style>
  html {
    font-family: var(--font-family-body);
    color: var(--color-foreground);
    background-color: var(--color-background);
    -webkit-font-smoothing: antialiased;
  }
</style>
